<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio interactif — Evan Rouzaud</title>
<meta name="description" content="Le portfolio interactif d'Evan Rouzaud : posez votre question, l'assistant répond à partir du portfolio. Mode règles instantané, ou petit modèle de langage qui tourne dans votre navigateur.">
<meta name="author" content="Evan Rouzaud">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1020'/><text y='68' x='50' text-anchor='middle' font-size='54' font-family='system-ui' font-weight='700' fill='%2360e6ff'>E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Page dédiée au portfolio interactif : elle ne contient que l'assistant, construit par
     chat/chat.js. Le style ci-dessous ne concerne que le bouton du coin, qui doit être
     visible et cliquable avant le chargement différé de chat/chat.css. */
  :root{
    --bg:#0C0B0A;
    --txt:#EDE8E0;
    --rule-hi:#3A3530;
    --accent:#FF5B2E;
    --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16.5px;line-height:1.6}
  :focus-visible{outline:1px solid var(--accent);outline-offset:2px}

  /* ---------- bouton du coin : un lien vers le site, sous « Réserver 30 minutes » ---------- */
  .peel{
    position:fixed;z-index:90;
    right:calc(24px + env(safe-area-inset-right,0px));
    bottom:calc(24px + env(safe-area-inset-bottom,0px))
  }
  .peel-btn{
    position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:12px 17px;white-space:nowrap;cursor:pointer;font-family:var(--sans);
    background:transparent;color:var(--txt);border:1px solid var(--rule-hi);
    font-size:11.8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    text-decoration:none;transition:background .18s,color .18s,border-color .18s
  }
  .peel-btn:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  @media(prefers-reduced-motion:reduce){.peel-btn{transition:none}}
  @media(max-width:560px){
    .peel{left:calc(24px + env(safe-area-inset-left,0px));right:calc(24px + env(safe-area-inset-right,0px))}
    .peel-btn{display:flex;width:100%;padding:15px 13px}
  }
</style>
</head>
<body data-chat-standalone>

<!-- ================= ASSISTANT : BOUTON DU COIN ================= -->
<!-- Un seul bouton en bas à droite, sous « Réserver 30 minutes », et il ramène au site.
     C'est un lien, pas un bouton : cette page n'a rien à basculer, elle EST le portfolio
     interactif. L'assistant est construit par chat/chat.js, chargé par chat/chat-loader.js. -->
<div class="peel" id="peel">
  <a class="peel-btn" id="site-link" href="site.html">
    <span class="peel-label">Site web</span>
  </a>
</div>

<script src="chat/chat-loader.js" defer></script>
</body>
</html>
